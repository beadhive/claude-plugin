[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "commitizen"
version = "0.4.1"
tag_format = "v$version"
# tag.gpgsign=true forces annotated tags, which need a message; cz must create them annotated
annotated_tag = true
update_changelog_on_bump = true
version_files = [
  "beadhive/.claude-plugin/plugin.json:\"version\"",
  ".claude-plugin/marketplace.json:\"version\"",
]
